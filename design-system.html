<!doctype html>
<html
  lang="en"
  class="intro-complete intro-finished"
  data-theme="light"
  data-initial-page="design-system"
>
  <head>
    <meta charset="utf-8" />
    <script>
      // Theme before first paint, same key the site uses, so arriving here
      // from a dark session does not flash light.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var systemDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute(
            'data-theme',
            saved || (systemDark ? 'dark' : 'light')
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Design System — No Bhad Codes</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Acme&family=Cormorant+Garamond:wght@400;600;700&family=Inconsolata:wght@400;500;700&display=swap"
    />
    <script type="module" src="/src/static-page.ts"></script>
  </head>
  <body data-page="design-system">
    <%- include('templates/partials/shell/header.ejs') %> <%-
    include('templates/partials/shell/portal-dropdown.ejs') %> <%-
    include('templates/partials/shell/nav.ejs') %>

    <main id="main-content" data-active-page="design-system">
      <!-- Generated from the token files by scripts/build-design-system-docs.mjs.
           Content only: this page composes the shell around it, the same way
           index.html and 404.html do. -->
      <%- include('templates/pages/design-system.ejs') %> <%-
      include('templates/partials/shell/footer.ejs') %>
    </main>

    <script>
      // Same inline fill index.html uses. The set-copyright-year module works
      // by element id; the curtain's year is a class, so it needs this.
      (function () {
        var year = String(new Date().getFullYear());
        document.querySelectorAll('.js-copyright-year').forEach(function (el) {
          el.textContent = year;
        });
      })();
    </script>
  </body>
</html>
