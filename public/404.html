<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var systemDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (systemDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var color = theme === 'dark' ? '#333333' : '#e0e0e0';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', color);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e0e0e0" />
    <meta name="robots" content="noindex" />
    <title>404 — No Bhad Codes</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      @font-face {
        font-family: 'Acme';
        src:
          url('/fonts/Acme/Acme-Regular.woff2') format('woff2'),
          url('/fonts/Acme/Acme-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      /* Mirrors src/design-system/tokens/colors.css. This page is served
         as a static file for unmatched routes, so it cannot import the
         hashed site bundle — the values are copied rather than referenced.
         Keep them in step with the token file. */
      :root {
        --nf-bg: #e0e0e0; /* --color-neutral-300 */
        --nf-fg: #333333; /* --color-dark */
        --nf-nav: #333333; /* --color-nav-text */
        --nf-muted: #555555;
        --nf-accent: #dc2626; /* --color-brand-accent */
        --nf-border: #333333;
        --nf-btn-bg: #333333;
        --nf-btn-fg: #e0e0e0;
        --nf-shadow: rgba(0, 0, 0, 0.2);
        --nf-container-padding: clamp(1rem, 4vw, 2rem);
        --nf-footer-height: 40px;
      }

      html[data-theme='dark'] {
        --nf-bg: #333333;
        --nf-fg: #e0e0e0;
        --nf-nav: #fafafa; /* --color-gray-50 */
        --nf-muted: #b0b0b0;
        --nf-accent: #dc2626;
        --nf-border: #e0e0e0;
        --nf-btn-bg: #e0e0e0;
        --nf-btn-fg: #333333;
        --nf-shadow: rgba(0, 0, 0, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        /* --font-family-body is never defined, so the site's body resolves
           to this fallback. Matching it keeps the copy identical. */
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        background: var(--nf-bg);
        color: var(--nf-fg);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        transition:
          background-color 0.35s ease,
          color 0.35s ease;
      }

      /* Header frame copied from src/styles/components/nav-base.css so the
         404 wears the same chrome as every other page: fixed, transparent,
         Acme, brand left, theme toggle + menu right. */
      .nf-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        z-index: 110;
        background-color: transparent;
        font-family: 'Acme', sans-serif;
        padding: 0;
        padding-top: env(safe-area-inset-top, 0);
      }

      .nf-header-inner {
        padding: 0 var(--nf-container-padding);
      }

      .nf-nav-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        width: 100%;
        min-height: 40px;
        flex-wrap: nowrap;
      }

      .nf-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: var(--nf-nav);
        font-weight: 600;
        font-size: 20px;
        text-shadow: 0 2px 4px var(--nf-shadow);
        text-transform: uppercase;
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 0.3s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .nf-brand:visited {
        color: var(--nf-nav);
      }

      .nf-brand:hover,
      .nf-brand:active {
        color: var(--nf-accent);
      }

      .nf-nav-right {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-shrink: 0;
        white-space: nowrap;
      }

      .nf-theme,
      .nf-menu {
        display: flex;
        align-items: center;
        gap: 12px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px 0;
        min-height: 40px;
        color: var(--nf-nav);
        text-transform: uppercase;
        flex-shrink: 0;
        font-family: inherit;
        font-size: inherit;
        line-height: inherit;
        text-shadow: 0 2px 4px var(--nf-shadow);
        transition: color 0.3s ease;
      }

      .nf-theme:hover,
      .nf-theme:active,
      .nf-menu:hover,
      .nf-menu:active {
        color: var(--nf-accent);
      }

      .nf-theme {
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        padding: 0;
      }

      .nf-menu {
        font-size: 20px;
        font-weight: 600;
        text-decoration: none;
      }

      .nf-menu .nf-menu-icon {
        width: 16px;
        height: 16px;
      }

      .nf-theme svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }

      html[data-theme='light'] .nf-theme .icon-sun {
        display: none;
      }

      html[data-theme='dark'] .nf-theme .icon-moon {
        display: none;
      }

      .nf-main {
        flex: 1;
        display: grid;
        place-items: center;
        /* Clear the fixed header and footer the way the site's tiles do. */
        padding: calc(60px + clamp(1.5rem, 5vw, 3rem)) clamp(1.5rem, 5vw, 3rem)
          calc(var(--nf-footer-height) + clamp(1.5rem, 5vw, 3rem));
      }

      .nf-card {
        width: min(100%, 40rem);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(1.25rem, 3vw, 2rem);
      }

      .nf-sign {
        width: min(100%, 22rem);
        height: auto;
        filter: drop-shadow(0.6rem 0.75rem 0 color-mix(in srgb, var(--nf-fg) 18%, transparent));
        transform-origin: 70% 100%;
        animation: nf-sway 5.5s ease-in-out infinite;
      }

      @keyframes nf-sway {
        0%,
        100% {
          transform: rotate(-1.6deg) translateY(0);
        }
        50% {
          transform: rotate(1.8deg) translateY(-0.35rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .nf-sign {
          animation: none;
        }
      }

      .nf-copy {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 28rem;
      }

      .nf-eyebrow {
        font-family: 'Acme', system-ui, sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--nf-accent);
      }

      .nf-title {
        font-family: 'Acme', system-ui, sans-serif;
        font-size: clamp(2rem, 6vw, 3.25rem);
        line-height: 1.05;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .nf-body {
        font-size: clamp(0.95rem, 2.2vw, 1.1rem);
        line-height: 1.55;
        color: var(--nf-muted);
      }

      .nf-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }

      .nf-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        min-height: 2.75rem;
        padding: 0.65rem 1.35rem;
        border: 1.5px solid var(--nf-border);
        text-decoration: none;
        font-family: 'Acme', system-ui, sans-serif;
        font-size: 1rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transition:
          transform 0.18s ease,
          background-color 0.18s ease,
          color 0.18s ease;
      }

      .nf-btn--primary {
        background: var(--nf-btn-bg);
        color: var(--nf-btn-fg);
      }

      .nf-btn--ghost {
        background: transparent;
        color: var(--nf-fg);
      }

      .nf-btn:hover {
        transform: translateY(-2px);
      }

      .nf-btn--ghost:hover {
        border-color: var(--nf-accent);
        color: var(--nf-accent);
      }

      /* Footer frame copied from src/styles/components/footer.css. */
      .nf-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: var(--nf-footer-height);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        background: transparent;
        padding: 0 2rem;
        font-size: clamp(0.875rem, 0.825rem + 0.25vw, 1rem);
        color: var(--nf-fg);
        text-align: right;
      }

      .nf-footer p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header class="nf-header">
      <div class="nf-header-inner">
        <nav class="nf-nav-row">
          <a class="nf-brand" href="/" aria-label="No Bhad Codes home">No Bhad Codes</a>
          <div class="nf-nav-right">
            <a class="nf-theme" href="/#/portal" aria-label="Client Portal Login">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 20a6 6 0 0 0-12 0" />
                <circle cx="12" cy="10" r="4" />
                <circle cx="12" cy="12" r="10" />
              </svg>
            </a>
            <button type="button" class="nf-theme" id="nf-theme-toggle" aria-label="Toggle dark/light theme">
              <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path
                  d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                ></path>
              </svg>
              <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"></path>
              </svg>
            </button>
            <!-- The nav overlay lives in the SPA bundle, which this static
                 page cannot load, so Menu links back to the site rather
                 than opening a menu that would have nothing behind it. -->
            <a class="nf-menu" href="/" aria-label="Back to the site">
              <svg xmlns="http://www.w3.org/2000/svg" class="nf-menu-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M7.33333 16L7.33333 -3.2055e-07L8.66667 -3.78832e-07L8.66667 16L7.33333 16Z" fill="currentColor"></path>
                <path d="M16 8.66667L-2.62269e-07 8.66667L-3.78832e-07 7.33333L16 7.33333L16 8.66667Z" fill="currentColor"></path>
                <path d="M6 7.33333L7.33333 7.33333L7.33333 6C7.33333 6.73637 6.73638 7.33333 6 7.33333Z" fill="currentColor"></path>
                <path d="M10 7.33333L8.66667 7.33333L8.66667 6C8.66667 6.73638 9.26362 7.33333 10 7.33333Z" fill="currentColor"></path>
                <path d="M6 8.66667L7.33333 8.66667L7.33333 10C7.33333 9.26362 6.73638 8.66667 6 8.66667Z" fill="currentColor"></path>
                <path d="M10 8.66667L8.66667 8.66667L8.66667 10C8.66667 9.26362 9.26362 8.66667 10 8.66667Z" fill="currentColor"></path>
              </svg>
              Menu
            </a>
          </div>
        </nav>
      </div>
    </header>

    <main class="nf-main">
      <div class="nf-card">
        <img
          class="nf-sign"
          src="/images/wile_404_sign.svg"
          width="997"
          height="919"
          alt="Hand-painted Acme-style road sign reading 404 Work In Progress"
        />
        <div class="nf-copy">
          <p class="nf-eyebrow">Channel lost</p>
          <h1 class="nf-title">That was a painted tunnel.</h1>
          <p class="nf-body">
            You followed a link straight into a tunnel painted on a rock wall — no page behind it,
            just the wall. Happens to the best of us. Take the scenic route back.
          </p>
        </div>
        <div class="nf-actions">
          <a class="nf-btn nf-btn--primary" href="/">Home</a>
          <a class="nf-btn nf-btn--ghost" href="/#/projects">Projects</a>
          <a class="nf-btn nf-btn--ghost" href="/#/contact">Contact</a>
        </div>
      </div>
    </main>

    <footer class="nf-footer">
      <p>&copy; <span id="nf-year"></span> Made &amp; Designed by No Bhad Codes. All rights reserved.</p>
    </footer>

    <script>
      document.getElementById('nf-year').textContent = new Date().getFullYear();
      document.getElementById('nf-theme-toggle').addEventListener('click', function () {
        var next =
          document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try {
          localStorage.setItem('theme', next);
        } catch (e) {}
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', next === 'dark' ? '#333333' : '#e0e0e0');
      });
    </script>
  </body>
</html>
