<!--
  Card back. Artwork from intro_paw.ai's card_back layer, drawn there at
  1352.31 x 772.75 (ratio 1.741). The site's card element is 1069.5 x 599.3
  (1.785) and both faces share one flip container, so the artwork keeps its size
  relative to the card's HEIGHT (scale 0.76390) and its centre is held at the
  same fraction across the card as the source (0.4906) rather than being forced
  to the middle — the source is deliberately a little left of centre. The frame
  below is redrawn at the shipped geometry.

  Arrow_Avatar comes out of Illustrator as an embedded 438x558 PNG — the dog is
  a placed raster on that layer. Substituted with the same dog as vector paths,
  matched to the raster's INK box (366x485); the PNG carries a symmetric 36px
  transparent bleed, so its image box is bigger than the drawing.
-->
