<!-- Card back, refitted from
     illustrator/business_card_animations/SVG/intro_pawCard_Back.svg

     The export draws a 1352.31 x 772.75 card (aspect 1.7500). The card this
     flips against is the one inside coyote_paw.svg — 1060.5 x 590.3, aspect
     1.7965 — because the intro hands the card from the paw to the DOM and the
     two faces must share an edge. Differently PROPORTIONED, not just sized.

     Artwork scaled uniformly at 0.763895 (height is the tighter axis) and
     centred, outline drawn at the paw scene's dimensions. The drawing keeps
     its proportions; the cost is 13.7px of margin each side.

     Do NOT re-export coyote_paw.svg from the current artboard to "fix" the
     mismatch: it renames every layer to paw1..paw4 and all 17 ids in
     SVG_ELEMENT_IDS vanish. The card travels; the paw does not.
-->
